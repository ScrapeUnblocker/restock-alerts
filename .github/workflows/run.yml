name: Restock check

on:
  schedule:
    # Every 15 minutes (UTC), off the top of the hour when GitHub is busiest. GitHub can
    # start scheduled runs late, or drop one under heavy load.
    # Each run costs 1 API call per product in config.yml (see "Cost" in the README).
    # For every 30 minutes use "4,34 * * * *".
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check stock, print what would be delivered, send nothing, save nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit state/stock.json when stock changes
    steps:
      - name: Check for the API key
        id: gate
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
        run: |
          if [ -z "$SCRAPEUNBLOCKER_KEY" ]; then
            echo "::notice title=Not set up yet::Add the SCRAPEUNBLOCKER_KEY repository secret (Settings > Secrets and variables > Actions) to start checking stock. Nothing was checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install .

      - name: Check stock and deliver restocks
        if: steps.gate.outputs.ready == 'true'
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: restock-alerts run $DRY_RUN_FLAG

      # state/stock.json only changes when stock changes, so most runs commit nothing.
      - name: Commit the state
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && !inputs.dry_run }}
        run: |
          git add state/
          if git diff --cached --quiet; then
            echo "No stock change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stock state [skip ci]"
          git pull --rebase
          git push
